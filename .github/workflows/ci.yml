name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # the toolchain line: same Go as the Docker build

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
