services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /home/dev/ferri-test/config.yaml:/config/config.yaml:ro
      - /home/dev/ferri-test/litestream.yml:/etc/litestream.yml:ro
      - /home/dev/ferri-test/storage:/data/storage
      - app_db:/data
    environment:
      - CONFIG_PATH=/config/config.yaml
      - ADMIN_TOKEN=test-token-for-local-use-123456
      - SMTP_PASSWORD=

volumes:
  app_db:
