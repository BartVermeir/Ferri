{{define "base-css"}}
<style>
    :root {
      --primary: {{.Settings.PrimaryColor}};
      --accent: {{if .Settings.AccentColor}}{{.Settings.AccentColor}}{{else}}{{.Settings.PrimaryColor}}{{end}};
      --bg: {{if .Settings.BgColor}}{{.Settings.BgColor}}{{else}}#f8f8f6{{end}};
      --font: {{if .Settings.FontFamily}}{{.Settings.FontFamily}}{{else}}'Inter', system-ui, sans-serif{{end}};
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: #1a1a1a;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .site-header {
      background: #fff;
      border-bottom: 1px solid #e8e8e4;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-header img { height: 32px; width: auto; }
    .site-header .company-name {
      font-size: 16px;
      font-weight: 500;
      color: #1a1a1a;
    }
    .page-wrap {
      max-width: 600px;
      margin: 48px auto;
      padding: 0 24px;
    }
    .page-wrap.wide { max-width: 900px; }
    .card {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 12px;
      padding: 32px;
    }
    h1 { font-size: 22px; font-weight: 500; margin-bottom: 24px; }
    h2 { font-size: 18px; font-weight: 500; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px; margin-top: 16px; }
    label:first-child { margin-top: 0; }
    input[type=text], input[type=email], input[type=password], textarea, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--font);
      background: #fff;
      color: #1a1a1a;
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    textarea { min-height: 80px; resize: vertical; }
    select { cursor: pointer; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #f0f0ec; color: #333; }
    .btn-danger { background: #fee2e2; color: #991b1b; }
    .file-drop {
      border: 2px dashed #ddd;
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-top: 4px;
    }
    .file-drop:hover, .file-drop.dragover { border-color: var(--primary); background: #f8f9ff; }
    .file-drop-icon { font-size: 32px; margin-bottom: 8px; color: #aaa; }
    .file-drop-text { color: #666; font-size: 14px; }
    .file-drop input[type=file] { display: none; }
    .file-list { margin-top: 12px; list-style: none; }
    .file-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f8f8f6;
      border-radius: 6px;
      margin-top: 6px;
      font-size: 13px;
      color: #333;
    }
    .file-list li .file-size { margin-left: auto; color: #888; }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 16px;
    }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .progress-wrap { margin-top: 16px; }
    .progress-bar {
      height: 4px;
      background: #e8e8e4;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.2s;
      width: 0%;
    }
    .progress-label { font-size: 13px; color: #666; margin-top: 6px; }
    .divider { border: none; border-top: 1px solid #e8e8e4; margin: 24px 0; }
    .text-muted { color: #888; font-size: 13px; }
    .mt-4 { margin-top: 4px; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 500; color: #888; border-bottom: 1px solid #e8e8e4; }
    td { padding: 12px; border-bottom: 1px solid #f0f0ec; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-active { background: #dcfce7; color: #166534; }
    .badge-pending { background: #fef9c3; color: #854d0e; }
    .badge-expired { background: #f1f5f9; color: #64748b; }
    .badge-request { background: #eff6ff; color: #1d4ed8; }
    @media (max-width: 640px) {
      .page-wrap { margin: 24px auto; }
      .card { padding: 20px; border-radius: 8px; }
    }
  </style>
{{end}}

{{define "base-header"}}
<header class="site-header">
  {{if .Settings.LogoURL}}
  <img src="{{.Settings.LogoURL}}" alt="{{.Settings.CompanyName}}">
  {{else}}
  <span class="company-name">{{.Settings.CompanyName}}</span>
  {{end}}
</header>
{{end}}
