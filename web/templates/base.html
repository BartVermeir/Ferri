{{define "base-css"}}
<style>
    :root {
      --primary: {{.Settings.PrimaryColor}};
      --accent: {{if .Settings.AccentColor}}{{.Settings.AccentColor}}{{else}}{{.Settings.PrimaryColor}}{{end}};
      --bg: {{if .Settings.BgColor}}{{.Settings.BgColor}}{{else}}#f8f8f6{{end}};
      --font: {{if .Settings.FontFamily}}{{.Settings.FontFamily}}{{else}}'Inter', system-ui, sans-serif{{end}};
      --primary-text: #fff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: #1a1a1a;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .site-header {
      background: #fff;
      border-bottom: 1px solid #e8e8e4;
      padding: 0 24px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-header img { height: 36px; width: auto; max-width: 180px; }
    .site-header .company-name { font-size: 15px; font-weight: 500; color: #1a1a1a; }
    .page-wrap { max-width: 580px; margin: 28px auto; padding: 0 20px; }
    .page-wrap.wide { max-width: 880px; }
    .card { background: #fff; border: 1px solid #e8e8e4; border-radius: 10px; padding: 24px; }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 16px; }
    h2 { font-size: 16px; font-weight: 500; margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 500; color: #555; margin-bottom: 3px; margin-top: 12px; }
    label:first-child { margin-top: 0; }
    input[type=text], input[type=email], input[type=password], textarea, select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      font-family: var(--font);
      background: #fff;
      color: #1a1a1a;
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    textarea { min-height: 64px; resize: vertical; }
    select { cursor: pointer; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    a.btn { text-decoration: none; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--primary-text, #fff); }
    .btn-secondary { background: #f0f0ec; color: #333; }
    .btn-danger { background: #fee2e2; color: #991b1b; }
    .file-drop {
      border: 2px dashed #ddd;
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-top: 3px;
    }
    .file-drop:hover, .file-drop.dragover { border-color: var(--primary); background: #f8f9ff; }
    .file-drop-icon { font-size: 22px; margin-bottom: 4px; color: #aaa; }
    .file-drop-text { color: #666; font-size: 13px; }
    .file-drop { position: relative; }
    .file-drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .file-list { margin-top: 8px; list-style: none; }
    .file-list li {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; background: #f8f8f6; border-radius: 5px;
      margin-top: 4px; font-size: 13px; color: #333;
    }
    .file-list li .file-size { margin-left: auto; color: #888; }
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-top: 12px; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .progress-wrap { margin-top: 12px; }
    .progress-bar { height: 3px; background: #e8e8e4; border-radius: 2px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.2s; width: 0%; }
    .progress-label { font-size: 12px; color: #666; margin-top: 5px; }
    .divider { border: none; border-top: 1px solid #e8e8e4; margin: 16px 0; }
    .text-muted { color: #888; font-size: 12px; }
    .mt-4 { margin-top: 4px; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 500; color: #888; border-bottom: 1px solid #e8e8e4; }
    td { padding: 10px; border-bottom: 1px solid #f0f0ec; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .badge-active { background: #dcfce7; color: #166534; }
    .badge-pending { background: #fef9c3; color: #854d0e; }
    .badge-expired { background: #f1f5f9; color: #64748b; }
    .badge-request { background: #eff6ff; color: #1d4ed8; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .label-hint { color: #aaa; font-weight: 400; }
    .url-display-box { background: #f8f8f6; border: 1px solid #e8e8e4; border-radius: 8px; padding: 12px 16px; }
    .url-display-text { word-break: break-all; font-size: 14px; color: #333; }
    .btn-row { display: flex; gap: 8px; }
    .card-centered { text-align: center; padding: 48px 32px; }
    .display-icon { font-size: 48px; margin-bottom: 16px; }
    .file-rows { margin-bottom: 16px; }
    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0ec;
    }
    .file-row-icon {
      width: 36px;
      height: 36px;
      background: #f0f0ec;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .file-row-info { flex: 1; min-width: 0; }
    .file-row-name {
      font-size: 14px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-row-size { font-size: 12px; color: #888; }
    .card-footer-row {
      display: flex;
      justify-content: flex-end;
      padding: 8px 0;
      border-top: 1px solid #f0f0ec;
      margin-top: 4px;
    }
    @media (max-width: 640px) {
      .page-wrap { margin: 16px auto; }
      .card { padding: 16px; border-radius: 8px; }
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
{{end}}

{{define "primary-text-script"}}
<script>
(function() {
  var p = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
  if (!p) return;
  var h = p.replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.substr(0,2),16)/255, g = parseInt(h.substr(2,2),16)/255, b = parseInt(h.substr(4,2),16)/255;
  document.documentElement.style.setProperty('--primary-text', (0.2126*r + 0.7152*g + 0.0722*b) > 0.5 ? '#000' : '#fff');
})();
</script>
{{end}}

{{define "base-header"}}
<header class="site-header">
  {{if .Settings.LogoURL}}
  <img src="{{.Settings.LogoURL}}" alt="{{.Settings.CompanyName}}">
  {{else}}
  <span class="company-name">{{.Settings.CompanyName}}</span>
  {{end}}
</header>
{{end}}
