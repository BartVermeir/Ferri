{{define "request_created.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.PageTitle}} — {{.Settings.CompanyName}}</title>
  {{template "base-css" .}}
</head>
<body>
  {{template "base-header" .}}
  <main>
    <div class="page-wrap">
      <div class="card">
        <h1>Upload link created</h1>
        <p class="text-muted">Send this link to the person you want files from:</p>
        <div class="mt-16" style="background:#f8f8f6; border:1px solid #e8e8e4; border-radius:8px; padding:12px 16px;">
          <a href="{{.UploadURL}}" style="word-break:break-all; font-size:14px;">{{.UploadURL}}</a>
        </div>
        <div class="mt-16" style="display:flex; gap:8px;">
          <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('{{.UploadURL}}').then(function(){this.textContent='Copied!'}.bind(this))">Copy link</button>
          <a href="/request" class="btn btn-secondary">New request</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>{{end}}
