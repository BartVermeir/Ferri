{{define "request_created.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.PageTitle}} — {{.Settings.CompanyName}}</title>
  {{template "base-css" .}}
</head>
<body>
  {{template "base-header" .}}
  <main>
    <div class="page-wrap">
      <div class="card">
        <h1>Upload link created</h1>
        <p class="text-muted">Send this link to the person you want files from:</p>
        <div class="mt-16" style="background:#f8f8f6; border:1px solid #e8e8e4; border-radius:8px; padding:12px 16px;">
          <span style="word-break:break-all; font-size:14px; color:#333;" id="upload-url">{{.UploadURL}}</span>
        </div>
        <div class="mt-16" style="display:flex; gap:8px;">
          <button class="btn btn-secondary" id="copy-btn">Copy link</button>
          <a href="/request" class="btn btn-secondary" style="text-decoration:none;">New request</a>
        </div>
      </div>
    </div>
  </main>

  {{template "primary-text-script" .}}
<script>
document.getElementById('copy-btn').addEventListener('click', function() {
  var btn = document.getElementById('copy-btn');
  var url = document.getElementById('upload-url').textContent.trim();

  function onSuccess() {
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.textContent = 'Copy link'; }, 2000);
  }
  function onFail() {
    btn.textContent = 'Copy failed';
    setTimeout(function() { btn.textContent = 'Copy link'; }, 2000);
  }

  // navigator.clipboard requires HTTPS — fall back to execCommand for HTTP
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(onSuccess).catch(onFail);
  } else {
    var ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy') ? onSuccess() : onFail();
    } catch(e) {
      onFail();
    }
    document.body.removeChild(ta);
  }
});
</script>
</body>
</html>{{end}}
