{{define "request_created.html"}}
{{template "base.html" .}}
{{define "content"}}
<div class="page-wrap">
  <div class="card">
    <h1>Upload link created</h1>
    <p class="text-muted">Send this link to the person you want files from:</p>
    <div class="mt-16" style="background:#f8f8f6; border:1px solid #e8e8e4; border-radius:8px; padding:12px 16px;">
      <a href="{{.UploadURL}}" style="word-break:break-all; font-size:14px;">{{.UploadURL}}</a>
    </div>
    <div class="mt-16" style="display:flex; gap:8px;">
      <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('{{.UploadURL}}').then(()=>this.textContent='Copied!')">Copy link</button>
      <a href="/request" class="btn btn-secondary">New request</a>
    </div>
    <p class="text-muted mt-16">Link expires {{.ExpiresAt | formatDate}}</p>
  </div>
</div>
{{end}}

{{end}}
