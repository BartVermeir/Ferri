{{template "base.html" .}}
{{define "content"}}
<div class="page-wrap">
  <div class="card">
    <h1>{{.PageTitle}}</h1>
    {{if .WelcomeMessage}}<p class="text-muted mt-8">{{.WelcomeMessage}}</p>{{end}}
    {{if .Error}}<div class="alert alert-error mt-16">{{.Error}}</div>{{end}}

    <form id="send-form">
      <label>Your name</label>
      <input type="text" name="sender_name" autocomplete="name" required>

      <label>Your email</label>
      <input type="email" name="sender_email" autocomplete="email" required>

      <label>Title</label>
      <input type="text" name="title">

      <label>Message</label>
      <textarea name="message" rows="3"></textarea>

      <label>Recipients <span class="text-muted">(one per line or comma-separated)</span></label>
      <textarea name="recipients" rows="3" required></textarea>

      <label>Files</label>
      <div class="file-drop" id="file-drop">
        <div class="file-drop-icon">↑</div>
        <div class="file-drop-text">Click to select or drag &amp; drop files</div>
        <input type="file" id="file-input" multiple>
      </div>
      <ul class="file-list" id="file-list"></ul>

      <label>Expires after</label>
      <select name="expiry_hours">
        {{range .ExpiryOptions}}
        <option value="{{.Hours}}">{{.Label}}</option>
        {{end}}
      </select>

      <label>Password <span class="text-muted">(optional)</span></label>
      <input type="password" name="password" autocomplete="new-password">

      <div class="mt-24">
        <button type="submit" class="btn btn-primary" id="submit-btn">Send files</button>
      </div>
    </form>

    <div id="progress-wrap" class="progress-wrap" style="display:none">
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <div class="progress-label" id="progress-label">Uploading…</div>
    </div>
    <div id="result-msg"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@latest/dist/tus.min.js"></script>
<script src="/static/upload.js"></script>
{{end}}
