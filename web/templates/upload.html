{{define "upload.html"}}
{{template "base.html" .}}
{{define "content"}}
<div class="page-wrap">
  <div class="card">
    <h1>{{.Request.Title}}</h1>
    {{if .Request.Message}}<p class="text-muted mt-8">{{.Request.Message}}</p>{{end}}
    <hr class="divider">

    <div id="upload-area">
      <label>Files</label>
      <div class="file-drop" id="file-drop">
        <div class="file-drop-icon">↑</div>
        <div class="file-drop-text">Click to select or drag &amp; drop files</div>
        <input type="file" id="file-input" multiple>
      </div>
      <ul class="file-list" id="file-list"></ul>

      <div class="mt-24">
        <button class="btn btn-primary" id="start-btn">Start upload</button>
      </div>
    </div>

    <div id="progress-wrap" class="progress-wrap" style="display:none">
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <div class="progress-label" id="progress-label">Uploading…</div>
    </div>

    <div id="done-area" style="display:none" class="mt-16">
      <div class="alert alert-success">All files uploaded.</div>
      <div class="mt-16">
        <form method="POST" action="{{.CompleteURL}}">
          <button type="submit" class="btn btn-primary">I'm done uploading</button>
        </form>
      </div>
    </div>

    <div id="result-msg"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@latest/dist/tus.min.js"></script>
<script src="/static/upload.js"></script>
{{end}}

{{end}}
