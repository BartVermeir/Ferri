{{define "admin-css"}}
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: {{.Settings.PrimaryColor}};
      --font: {{if .Settings.FontFamily}}{{.Settings.FontFamily}}{{else}}'Inter', system-ui, sans-serif{{end}};
    }
    body { font-family: var(--font); background: #f8f8f6; color: #1a1a1a; font-size: 14px; line-height: 1.5; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid #e8e8e4;
      padding: 24px 0;
      flex-shrink: 0;
    }
    .sidebar .logo {
      padding: 0 20px 20px;
      border-bottom: 1px solid #e8e8e4;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 500;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      color: #555;
      font-size: 13px;
      transition: background 0.1s;
    }
    .sidebar nav a:hover { background: #f8f8f6; color: #1a1a1a; text-decoration: none; }
    .sidebar nav a.active { background: #f0f0ec; color: #1a1a1a; font-weight: 500; }
    .sidebar nav .nav-section {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #aaa;
      padding: 16px 20px 4px;
    }
    .main-content { flex: 1; padding: 32px; overflow: auto; }
    .page-header { margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }
    .page-header h1 { font-size: 20px; font-weight: 500; }
    .card {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e8e8e4;
      font-weight: 500;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-body { padding: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 16px; font-size: 12px; font-weight: 500; color: #888; border-bottom: 1px solid #e8e8e4; background: #fafafa; }
    td { padding: 12px 16px; border-bottom: 1px solid #f0f0ec; font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .badge-active { background: #dcfce7; color: #166534; }
    .badge-pending { background: #fef9c3; color: #854d0e; }
    .badge-expired { background: #f1f5f9; color: #64748b; }
    .badge-transfer { background: #f0f0ec; color: #555; }
    .badge-request { background: #eff6ff; color: #1d4ed8; }
    .badge-sent { background: #dcfce7; color: #166534; }
    .badge-failed { background: #fee2e2; color: #991b1b; }
    .btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; font-family: var(--font); cursor: pointer; border: 1px solid transparent; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #f0f0ec; color: #333; border-color: #e8e8e4; }
    .btn-danger { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    input[type=text], input[type=email], input[type=password], input[type=url], input[type=color], textarea, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      font-family: var(--font);
      background: #fff;
      color: #1a1a1a;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    input[type=color] { height: 36px; padding: 2px 4px; cursor: pointer; }
    label { display: block; font-size: 12px; font-weight: 500; color: #555; margin-bottom: 4px; margin-top: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: #fff; border: 1px solid #e8e8e4; border-radius: 10px; padding: 16px 20px; }
    .stat-card .stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .stat-card .stat-value { font-size: 24px; font-weight: 500; color: #1a1a1a; }
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    .alert-success { background: #dcfce7; color: #166534; }
    .alert-error { background: #fee2e2; color: #991b1b; }
    .nav-logout { margin-top: auto; padding: 16px 20px 0; border-top: 1px solid #e8e8e4; margin-top: 16px; }
  </style>
{{end}}
