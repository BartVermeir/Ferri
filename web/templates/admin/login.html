{{define "admin/login.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8f8f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border: 1px solid #e8e8e4; border-radius: 12px; padding: 32px; width: 340px; }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px; }
    input { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 16px; }
    input:focus { border-color: #000; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #000; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .btn:hover { opacity: 0.85; }
    .error { color: #991b1b; background: #fee2e2; border: 1px solid #fecaca; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="card">
  <h1>Admin login</h1>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="POST" action="/admin/login">
    <label>Token</label>
    <input type="password" name="token" autofocus required>
    <button type="submit" class="btn">Login</button>
  </form>
</div>
</body>
</html>{{end}}
