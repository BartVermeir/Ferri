{{define "admin/transfers.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.PageTitle}} — Admin</title>
  {{template "admin-css" .}}
</head>
<body>
<div class="admin-layout">
  {{template "admin-nav" .}}
  <main class="main-content">
    <div class="page-header"><h1>All transfers</h1></div>
    <div class="card">
      <table>
        <thead>
          <tr><th>Title</th><th>Sender</th><th>Status</th><th>Expires</th><th>Action</th></tr>
        </thead>
        <tbody>
          {{range .Transfers}}
          <tr>
            <td>{{.Title}}</td>
            <td>{{.SenderEmail}}</td>
            <td><span class="badge badge-{{.Status}}">{{.Status}}</span></td>
            <td>{{.ExpiresAt | formatDate}}</td>
            <td>
              <form method="POST" action="/admin/transfers/{{.ID}}/delete" style="display:inline">
                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete?')">Delete</button>
              </form>
            </td>
          </tr>
          {{else}}
          <tr><td colspan="5" style="color:#aaa; text-align:center; padding:24px;">No transfers</td></tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
(function() {
  var primary = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
  if (!primary) return;
  var hex = primary.replace('#','');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r = parseInt(hex.substr(0,2),16)/255;
  var g = parseInt(hex.substr(2,2),16)/255;
  var b = parseInt(hex.substr(4,2),16)/255;
  var luminance = 0.2126*r + 0.7152*g + 0.0722*b;
  document.documentElement.style.setProperty('--primary-text', luminance > 0.5 ? '#000' : '#fff');
})();
</script>
</body>
</html>{{end}}
