{{define "admin/mail.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.PageTitle}} — Admin</title>
  {{template "admin-css" .}}
</head>
<body>
<div class="admin-layout">
  {{template "admin-nav" .}}
  <main class="main-content">
    <div class="page-header"><h1>Mail queue</h1></div>
    <div class="card">
      <table>
        <thead>
          <tr><th>To</th><th>Subject</th><th>Status</th><th>Attempts</th><th>Error</th></tr>
        </thead>
        <tbody>
          {{range .Mails}}
          <tr>
            <td>{{.ToAddress}}</td>
            <td>{{.Subject}}</td>
            <td><span class="badge badge-{{.Status}}">{{.Status}}</span></td>
            <td>{{.Attempts}}</td>
            <td style="color:#888; font-size:12px;">{{.ErrorMessage.String}}</td>
          </tr>
          {{else}}
          <tr><td colspan="5" style="color:#aaa; text-align:center; padding:24px;">Mail queue is empty</td></tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
(function() {
  var primary = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
  if (!primary) return;
  var hex = primary.replace('#','');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r = parseInt(hex.substr(0,2),16)/255;
  var g = parseInt(hex.substr(2,2),16)/255;
  var b = parseInt(hex.substr(4,2),16)/255;
  var luminance = 0.2126*r + 0.7152*g + 0.0722*b;
  document.documentElement.style.setProperty('--primary-text', luminance > 0.5 ? '#000' : '#fff');
})();
</script>
</body>
</html>{{end}}
