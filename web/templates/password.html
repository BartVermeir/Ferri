{{define "password.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.PageTitle}} — {{.Settings.CompanyName}}</title>
  {{template "base-css" .}}
</head>
<body>
  {{template "base-header" .}}
  <main>
    <div class="page-wrap">
      <div class="card">
        <h1>Password required</h1>
        <p class="text-muted">This transfer is protected with a password.</p>
        {{if .Error}}<div class="alert alert-error mt-16">{{.Error}}</div>{{end}}
        <form method="POST">
          <label>Password</label>
          <input type="password" name="password" autofocus required>
          <div class="mt-24">
            <button type="submit" class="btn btn-primary">Continue</button>
          </div>
        </form>
      </div>
    </div>
  </main>

<script>
(function() {
  var primary = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
  if (!primary) return;
  var hex = primary.replace('#','');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r = parseInt(hex.substr(0,2),16)/255;
  var g = parseInt(hex.substr(2,2),16)/255;
  var b = parseInt(hex.substr(4,2),16)/255;
  var luminance = 0.2126*r + 0.7152*g + 0.0722*b;
  document.documentElement.style.setProperty('--primary-text', luminance > 0.5 ? '#000' : '#fff');
})();
</script>
</body>
</html>{{end}}
