services:
  app:
    # Template only. scripts/deploy.sh pins the image tag in the live copy
    # (/opt/ferri/docker-compose.yml) to the deployed release. The running
    # version is shown at the bottom of /admin.
    image: ferri:vX.Y.Z
    restart: unless-stopped
    user: "1000:1000"
    read_only: true                      # Container filesystem is read-only (hardened)
    stop_grace_period: 300s             # 5 minutes for running downloads to finish on shutdown
    logging:                             # Log rotation: at most 5 files of 50 MB
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    tmpfs:
      - /tmp                             # Scratch space; the rest of the filesystem is read-only
    ports:
      - "127.0.0.1:8080:8080"           # Only localhost — reverse proxy connects here
    volumes:
      - ./config.yaml:/config/config.yaml:ro          # Deploy-time configuration (read-only)
      - /mnt/nfs/ferri:/data/storage                  # NFS mount for file storage
      - app_db:/data                                   # SQLite database (named volume)
    environment:
      - CONFIG_PATH=/config/config.yaml
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    cap_drop:
      - ALL                              # Drop all Linux capabilities
    security_opt:
      - no-new-privileges:true          # Cannot escalate to root
    healthcheck:
      test: ["CMD", "/ferri", "-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_db:
    # Named volume for the SQLite database.
    # Survives container restarts and docker compose down. Not backed up.
